[project]
name = "acme"
version = "0.0.1"
description = "python template"
readme = ".github/README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "clu>=0.0.12",
    "datasets>=5.1.0",
    "einops>=0.8.1",
    "flax>=0.12.6",
    "huggingface-hub>=2.2.0",
    "jaxtyping>=0.3.2",
    "ml-collections>=1.1.0",
    "orbax-checkpoint>=0.12.8",
    "safetensors>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
wandb = [
    "wandb>=0.20.1",
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I001"]
# jaxtyping shape strings like "batch seq" are not forward references.
ignore = ["F722"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
	"ignore::UserWarning"
]

